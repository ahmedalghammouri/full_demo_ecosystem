user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # Use Docker's embedded DNS so upstream container names are re-resolved at
    # request time (valid=10s). Without this, nginx resolves the upstream IP once
    # at startup and returns 502 after an api/web container is recreated with a
    # new IP. Paired with variable proxy_pass targets in conf.d/mes.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting zones
    #
    # MEASURED, not estimated: a single dashboard load fires the page's own queries
    # PLUS ~9 sidebar badge queries, and `refetchOnMount: 'always'` re-runs all of
    # them on every navigation. 300r/m (5/s) was exceeded by ordinary use, and the
    # resulting 429s made React Query return undefined — so cards rendered 0 and the
    # same page showed different numbers on each reload. A rate limit must never be
    # able to masquerade as production data.
    #
    # 1200r/m (20/s) still stops a runaway client but is far above real usage.
    #
    # Note these key on $binary_remote_addr: behind Docker (or any proxy) every
    # browser shares one source IP, so the whole plant shares a single bucket.
    # If this ever needs to be per-user, key on $http_authorization instead.
    limit_req_zone $binary_remote_addr zone=api:10m rate=1200r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Throttling is a client-side condition, not a server outage. nginx's default
    # is 503, which is indistinguishable from "upstream is down" and sends people
    # debugging the wrong layer. 429 says what actually happened.
    limit_req_status 429;

    # CORS: echo back the origin for localhost AND private LAN ranges (10/8,
    # 172.16/12, 192.168/16) so phones/tablets on the factory network can reach
    # the API by IP. Anything else → empty (blocked).
    map $http_origin $cors_origin {
        default          "";
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$"                     $http_origin;
        "~^https?://10\.\d{1,3}\.\d{1,3}\.\d{1,3}(:\d+)?$"               $http_origin;
        "~^https?://192\.168\.\d{1,3}\.\d{1,3}(:\d+)?$"                  $http_origin;
        "~^https?://172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}(:\d+)?$" $http_origin;
        # Whole industry360 domain family (any subdomain, http/https, any port)
        "~*^https?://([a-z0-9-]+\.)*industry360\.(com|sa)(:\d+)?$"           $http_origin;
        "http://web:3000"  $http_origin;
    }

    # NOTE: upstream{} blocks intentionally removed — they resolve container
    # names only once at startup (the 502-after-recreate bug). conf.d/mes.conf
    # now uses variable proxy_pass targets (api:3001 / web:4000) so the resolver
    # above re-resolves them per request.

    include /etc/nginx/conf.d/*.conf;
}
